name: Deploy production

# Production deploys on a published GitHub Release (created by merging the
# release-please PR), not on every merge to main. See docs/operations/deployment.md.
on:
  release:
    types: [published]
  # Manual re-deploy or rollback: choose a published release tag in "Use workflow from".
  # Branches are rejected by the first step.
  workflow_dispatch:

permissions:
  contents: read # also lets the guard step read release metadata

# Never run two production deploys at once, and never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      # A manual run must be started from a published release tag, never a branch,
      # so production only ever runs released code.
      - name: Require a published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a release tag, not the branch '$REF_NAME'."
            exit 1
          fi
          draft=$(gh release view "$REF_NAME" --repo "$REPO" --json isDraft --jq .isDraft)
          if [ "$draft" != "false" ]; then
            echo "::error::'$REF_NAME' is not a published release."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: pnpm exec wrangler deploy --tag "$REF_NAME" --message "$REF_NAME ($COMMIT_SHA)"

      # ADR 0011, item 9: `/` answers and the running build is the released commit. No browser,
      # no sign-in, no AI. A failure fails this run; rollback stays manual (see
      # docs/operations/deployment.md). The new version can take a moment to reach every
      # location, so retry (6 attempts, 10 s apart; each request is capped at 10 s) before failing.
      - name: Smoke test
        env:
          SITE_URL: https://unfold.pragyan-fyi.workers.dev
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5 6; do
            # A failed transfer leaves the value empty, so it can never count as a pass.
            home=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$SITE_URL/") || home=""
            version=$(curl -fsS --max-time 10 "$SITE_URL/version.json" | jq -r '.version') || version=""
            echo "attempt $attempt: / -> $home, version -> $version (want $COMMIT_SHA)"
            if [ "$home" = "200" ] && [ "$version" = "$COMMIT_SHA" ]; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Smoke test failed: / returned '$home' and /version.json said '$version', expected $COMMIT_SHA."
          exit 1
