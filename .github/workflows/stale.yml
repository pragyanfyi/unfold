name: Stale

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Close stale needs-more-info
    if: github.repository == 'pragyanfyi/unfold'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs-more-info
          days-before-stale: 14
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue needs more information and has had no activity for 14 days.
            It will be closed in 7 days unless there is an update.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen with the requested details.
