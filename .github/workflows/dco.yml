name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an' "$sha")"
            case "$author" in
              *"[bot]"*) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit ${sha:0:12} is missing a Signed-off-by line"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off with 'git commit -s', or fix existing commits with 'git rebase --signoff main'."
            echo "See CONTRIBUTING.md#sign-your-commits-dco"
            exit 1
          fi
