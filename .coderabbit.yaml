# CodeRabbit configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Reviews apply the project's own written rules (AGENTS.md and docs/internals).
# Change a rule in those files, not here, unless the change is about *where* a
# rule applies.
language: en-US

reviews:
  # chill = balanced. Raise to "assertive" only if reviews feel too lenient.
  profile: chill

  # Trim walkthrough noise.
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Dependabot PRs are mechanical; release PRs are generated by release-please.
    ignore_usernames:
      - "dependabot[bot]"
    ignore_title_keywords:
      - "chore(release)"

  # Generated or vendored files add noise and no signal.
  path_filters:
    - "!**/pnpm-lock.yaml"
    - "!**/routeTree.gen.ts"
    - "!**/CHANGELOG.md"
    - "!**/dist/**"
    - "!**/.wrangler/**"
    - "!**/.tanstack/**"
    # shadcn/ui generated components (CLI output). Review changes to them by hand.
    - "!apps/web/src/components/ui/**"

  path_instructions:
    - path: "apps/web/src/**/*.{ts,tsx}"
      instructions: |
        Hold changed code to docs/internals/data-fetching.md and docs/internals/byok-and-secrets.md.
        Flag: fetching inside useEffect, server data copied into other state, inline query keys,
        unvalidated input at server functions, module-scope D1/KV handles, and any path where an
        API key could be logged, stored, put in a URL, a query key or a persisted cache.

    - path: "apps/web/src/**/*.{tsx,css}"
      instructions: |
        Hold changed code to docs/internals/web-ui.md. Flag: hand-rolled primitives that shadcn/ui
        provides, hard-coded colours instead of theme tokens, missing accessible names or labels,
        elements not operable by keyboard, and a second toast library (Sonner only).

    - path: "apps/web/src/**/*.{ts,tsx}"
      instructions: |
        Only when the change adds or touches keyboard handling (keydown or key listeners, hotkey
        hooks, shortcut definitions), hold it to docs/internals/hotkeys.md. Flag: shortcuts
        registered outside the single registry, duplicate key combinations in the same scope,
        shortcuts that fire while typing in an input, and overriding browser or OS shortcuts.
        Otherwise ignore this instruction.

    - path: "**/*.test.{ts,tsx}"
      instructions: |
        Hold changed tests to docs/internals/testing.md. Flag: real network or real AI provider
        calls, real-looking API keys in fixtures, time or order dependence, and weakened or deleted
        assertions. Request tests only where the rules require them.

    - path: ".github/workflows/**"
      instructions: |
        Third-party actions must be pinned to a full commit SHA with a version comment. Each job
        sets the minimum permissions. Untrusted values (PR titles, branch names, event payload
        fields) must be passed through env, never interpolated into run scripts. Flag
        pull_request_target or workflow_run combined with checking out or running PR code.
        Secrets must not be echoed or exposed to fork PRs.

    - path: "docs/adr/**"
      instructions: |
        ADRs use Status, Date, Context, Decision and Consequences. An Accepted ADR is not edited
        in place; it is superseded by a new ADR. Claims about third-party behaviour must cite a
        source and a read date, and must not be stated more strongly than the source supports.

    - path: "{AGENTS.md,README.md,CONTRIBUTING.md,.github/SECURITY.md,docs/**/*.md}"
      instructions: |
        Planned behaviour must be written as planned (future tense, or marked TBD); do not
        describe unbuilt features as existing. SECURITY.md, docs/adr/0003-bring-your-own-key-handling.md
        and docs/internals/byok-and-secrets.md must stay consistent with each other. AGENTS.md
        must stay under about 60 lines.

    - path: "**/package.json"
      instructions: |
        A new dependency needs a reason in the PR description. Flag unmaintained, duplicate-purpose
        or heavy packages, and install scripts. Dependencies must not be added only to avoid a
        few lines of code.

  tools:
    # Biome owns formatting and linting, including Markdown formatting.
    markdownlint:
      enabled: false
    biome:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    # A plain string pattern scopes a guideline file to its own directory, so each
    # internals file is mapped with files/applyTo to the code it governs. Patterns
    # are comma-separated, so these globs deliberately avoid braces.
    # Adding a docs/internals file? Add its mapping here too.
    filePatterns:
      - "AGENTS.md"
      - files: "docs/internals/web-ui.md"
        applyTo: "apps/web/src/**/*.tsx,apps/web/src/**/*.css"
      - files: "docs/internals/data-fetching.md"
        applyTo: "apps/web/src/**/*.ts,apps/web/src/**/*.tsx"
      - files: "docs/internals/byok-and-secrets.md"
        applyTo: "apps/web/src/**/*.ts,apps/web/src/**/*.tsx,apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx"
      - files: "docs/internals/hotkeys.md"
        # Keyboard handling can appear in any component or route, so this is not
        # limited to files with "hotkey" or "shortcut" in the name.
        applyTo: "apps/web/src/**/*.ts,apps/web/src/**/*.tsx"
      - files: "docs/internals/testing.md"
        applyTo: "apps/web/src/**/*.test.ts,apps/web/src/**/*.test.tsx"
